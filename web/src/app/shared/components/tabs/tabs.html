<nav class="tabs" aria-label="Relay actions">
  @for (tab of tabs(); track tab.id) {
    <button
      type="button"
      class="tabs__item"
      [class.is-active]="tab.id === activeTab()"
      [attr.aria-current]="tab.id === activeTab() ? 'page' : null"
      (click)="activeTabChange.emit(tab.id)"
    >
      {{ tab.label }}
    </button>
  }
</nav>
