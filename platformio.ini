; PlatformIO Project Configuration File
; 
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
; 
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini
default_envs = arduino_nano_esp32

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
upload_protocol = esptool
board_build.filesystem = littlefs
monitor_speed = 115200
board_build.partitions = partitions_nano_16mb.csv
lib_deps = 
    adafruit/RTClib @ ^2.1.3
    https://github.com/witnessmenow/Universal-Arduino-Telegram-Bot.git
    bblanchon/ArduinoJson @ ^7.1.0

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D AP_SSID_NAME=${secrets.ap_ssid}
    -D AP_PASS=${secrets.ap_pass}
    -D RELAY_DOMAIN_NAME=${secrets.relay_domain_name}
    -D BOARD_NANO_ESP32


[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
board_build.partitions = partitions_c3_4mb.csv
lib_deps = 
    adafruit/RTClib @ ^2.1.3
    https://github.com/witnessmenow/Universal-Arduino-Telegram-Bot.git
    bblanchon/ArduinoJson @ ^7.1.0

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D AP_SSID_NAME=${secrets.ap_ssid}
    -D AP_PASS=${secrets.ap_pass}
    -D RELAY_DOMAIN_NAME=${secrets.relay_domain_name}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_C3_SUPERMINI